name: Build Cross-Platform Executables

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip and install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt

      - name: Build Windows executable
        run: |
          python build.py --onefile --archive
        timeout-minutes: 30

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: NetworkAIMonitor-Windows
          path: dist/*
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip and install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt

      - name: Build macOS executable
        run: |
          python build.py --onefile --archive
        timeout-minutes: 30

      - name: Upload macOS executable
        uses: actions/upload-artifact@v4
        with:
          name: NetworkAIMonitor-macOS
          path: dist/*
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libxkbcommon-x11-0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0

      - name: Upgrade pip and install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt

      - name: Build Linux executable
        run: |
          python build.py --onefile --archive
        timeout-minutes: 30

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: NetworkAIMonitor-Linux
          path: dist/*
          if-no-files-found: warn

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
