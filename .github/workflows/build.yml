# .github/workflows/release.yml
# Professional Cross-Platform Release Pipeline
# Network AI Monitor

name: Build Professional Releases

on:
  push:
    branches:
      - main
      - master

    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:

  # =========================================================
  # WINDOWS BUILD
  # =========================================================

  build-windows:

    name: Windows Build
    runs-on: windows-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Dependencies
        run: |
          pip install pyinstaller pyinstaller-hooks-contrib pillow
          pip install -r requirements.txt

      - name: Verify Files
        run: |
          dir
          echo ----------------
          dir assets
          echo ----------------
          dir core
          echo ----------------
          dir dashboard

      - name: Build Application
        run: |
          pyinstaller --clean NetworkAIMonitor.spec

      - name: Verify Dist
        run: |
          dir dist
          dir dist\NetworkAIMonitor

      - name: Create Portable ZIP
        run: |
          mkdir release

          powershell Compress-Archive `
            -Path dist\NetworkAIMonitor `
            -DestinationPath release\NetworkAIMonitor-Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkAIMonitor-Windows
          path: release/NetworkAIMonitor-Windows.zip
          if-no-files-found: error

  # =========================================================
  # LINUX BUILD
  # =========================================================

  build-linux:

    name: Linux Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon0 \
            upx-ucl

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Python Dependencies
        run: |
          pip install pyinstaller pyinstaller-hooks-contrib pillow
          pip install -r requirements.txt

      - name: Verify Files
        run: |
          ls -la
          echo ----------------
          ls -la assets
          echo ----------------
          ls -la core
          echo ----------------
          ls -la dashboard

      - name: Build Application
        run: |
          pyinstaller --clean NetworkAIMonitor.spec

      - name: Verify Dist
        run: |
          ls -la dist/
          ls -la dist/NetworkAIMonitor/

      - name: Create Portable Archive
        run: |
          mkdir -p release

          tar -czf \
            release/NetworkAIMonitor-Linux.tar.gz \
            -C dist \
            NetworkAIMonitor

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkAIMonitor-Linux
          path: release/NetworkAIMonitor-Linux.tar.gz
          if-no-files-found: error

  # =========================================================
  # macOS BUILD
  # =========================================================

  build-macos:

    name: macOS Build
    runs-on: macos-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

          brew install upx || true

          pip install pyinstaller pyinstaller-hooks-contrib pillow
          pip install -r requirements.txt

      - name: Verify Files
        run: |
          ls -la
          echo ----------------
          ls -la assets
          echo ----------------
          ls -la core
          echo ----------------
          ls -la dashboard

      - name: Build Application
        run: |
          pyinstaller --clean NetworkAIMonitor.spec

      - name: Verify Dist
        run: |
          ls -la dist/
          ls -la dist/NetworkAIMonitor/

      - name: Create macOS ZIP
        run: |
          mkdir -p release

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            dist/NetworkAIMonitor \
            release/NetworkAIMonitor-macOS.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkAIMonitor-macOS
          path: release/NetworkAIMonitor-macOS.zip
          if-no-files-found: error

  # =========================================================
  # GITHUB RELEASE
  # =========================================================

  release:

    name: Create GitHub Release

    needs:
      - build-windows
      - build-linux
      - build-macos

    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/v')

    steps:

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show Artifacts
        run: |
          echo "Artifacts:"
          find artifacts -type f -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz

          generate_release_notes: true

          draft: false
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
